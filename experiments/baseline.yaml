# Baseline: the three MVP configs (D14 confirmed).
name: baseline
description: Default / efficient / capable Google configs over the full suite.
suite: suites/verified-mvp-v1.json
agy_path: /home/john/.local/bin/agy
passes: 1          # D15: complete 1 full matched pass first to conserve shared weekly quotas
timeout_minutes: 45
prompt_template: minimal-v1
configs:
  - label: default-argon-medium
    role: default
    model_id: gemini-4-argon-medium
    buckets: [gemini-argon-wtu-weekly]
  - label: efficient-flash-medium
    role: efficient
    model_id: gemini-3.8-flash-medium
    buckets: [gemini-5h, gemini-weekly]
  - label: capable-argon-high
    role: capable
    model_id: gemini-4-argon-high
    buckets: [gemini-argon-wtu-weekly]
quota:
  max_weekly_fraction_per_config_cycle: 0.25  # Cap each config at 25 pp weekly spend (leaves >=20% Argon reserved)
  external_use_threshold: 0.0005  # 0.05 pp tolerance for backend quota settling jitter
  weekly_bucket_by_config:
    default-argon-medium: gemini-argon-wtu-weekly
    efficient-flash-medium: gemini-weekly
    capable-argon-high: gemini-argon-wtu-weekly
  primary_bucket_by_config:
    default-argon-medium: gemini-argon-wtu-weekly
    efficient-flash-medium: gemini-5h
    capable-argon-high: gemini-argon-wtu-weekly
